<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Native Spatial Pipe architecture</title>
  <desc id="desc">Spatial objects and PCM enter Croksor for input handoff and rendering, then reach ASIO, Inferno AoIP or WASAPI. FSA and Zig manage sessions; telemetry feeds the web interface.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="258" rx="18" fill="none" stroke="#3d444d"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="30" y="34" fill="#9198a1" font-size="11" letter-spacing="2">NATIVE SPATIAL PIPE / AUDIO PATH</text>
    <rect x="30" y="54" width="264" height="116" rx="12" fill="none" stroke="#3d444d"/>
    <rect x="348" y="54" width="264" height="116" rx="12" fill="none" stroke="#4493f8"/>
    <rect x="666" y="54" width="264" height="116" rx="12" fill="none" stroke="#3d444d"/>
    <g fill="#9198a1" font-size="10" letter-spacing="1.6">
      <text x="50" y="80">01 / INPUT</text><text x="368" y="80">02 / PROCESSING</text><text x="686" y="80">03 / OUTPUT</text>
    </g>
    <g fill="#f0f6fc" font-size="21" font-weight="600">
      <text x="50" y="112">Spatial objects + PCM</text><text x="368" y="112">Croksor</text><text x="686" y="112">Multichannel playback</text>
    </g>
    <g fill="#9198a1" font-size="13">
      <text x="50" y="143">Native capture · Optional media decode</text>
      <text x="368" y="143">Input handoff · ROAR / LIRA rendering</text>
      <text x="686" y="143">ASIO · Inferno AoIP · WASAPI</text>
    </g>
    <g fill="none" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"><path d="M307 112H334"/><path d="M625 112H652"/></g>
    <path d="M30 192H930" stroke="#3d444d"/>
    <text x="30" y="225" fill="#9198a1" font-size="11" letter-spacing="1.2">CONTROL</text>
    <text x="113" y="225" fill="#f0f6fc" font-size="13">FSA + Zig · Session management</text>
    <circle cx="480" cy="221" r="2" fill="#3d444d"/>
    <text x="516" y="225" fill="#9198a1" font-size="11" letter-spacing="1.2">OBSERVABILITY</text>
    <text x="650" y="225" fill="#f0f6fc" font-size="13">Telemetry · Local web interface</text>
  </g>
</svg>
