name: Public Windows candidate

on:
  push:
    branches: [alpha-dev]
  pull_request:
    branches: [main, alpha-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-contracts:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      CARGO_HOME: ${{ github.workspace }}/work/rust/cargo
      RUSTUP_HOME: ${{ github.workspace }}/work/rust/rustup
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out public candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Set up Node for isolated frontend tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify public source and documentation
        run: |
          python tools/ci/Verify-Candidate.py
          if ($LASTEXITCODE) { throw 'Public boundary/manifest check failed' }
          python tools/Check-MarkdownEncoding.py .
          if ($LASTEXITCODE) { throw 'Markdown encoding check failed' }
      - name: Prepare pinned build tools and public dependencies
        run: ./tools/ci/Prepare-Windows.ps1 -Stage All
      - name: Build current product
        run: |
          New-Item -ItemType Directory -Force build/ci-logs | Out-Null
          Start-Transcript build/ci-logs/product-build.txt
          try {
            ./tools/Build-Product.ps1 -Python (Get-Command python.exe).Source -MediaFoundation -PcmCapture -BrowserIdentity -Wasapi
            if ($LASTEXITCODE) { throw 'Product build failed' }
            ./modules/freesurround/Build.ps1 -TargetDirectory build/freesurround-mature480 -Window 480 -HalfHop
            if ($LASTEXITCODE) { throw 'FreeSurround build failed' }
          } finally { Stop-Transcript }
      - name: Run isolated contracts
        run: ./tools/ci/Test-Candidate.ps1 -Python (Get-Command python.exe).Source
      - name: Verify final source manifest
        run: |
          python tools/ci/Verify-Candidate.py
          if ($LASTEXITCODE) { throw 'Build changed shipped source unexpectedly' }
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-windows-validation-logs
          path: build/ci-logs/
          if-no-files-found: warn
          retention-days: 14
