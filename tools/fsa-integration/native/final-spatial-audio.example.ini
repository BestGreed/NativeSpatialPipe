; Public defaults: example rule disabled. Copy to final-spatial-audio.ini.
[Manager]
; auto: Chinese Windows UI -> Chinese; otherwise English. zh/en override. Restart to apply.
Language=auto
Fallback=Stereo
DebounceMs=500

[Rule:ExampleGame]
Enabled=0
Exe=YourGame.exe
Scope=Running
Profile=7.1
Priority=300

[NSP]
; Default native orchestration. Empty path resolves beside the integration build.
Scheduler=Zig
ControlExecutable=
; Optional absolute JSON path: same playback schema as the NSP desktop.
; Empty keeps the existing capture/record path. Requires Scheduler=Zig.
PlaybackConfig=
; Python is used by telemetry; legacy orchestration requires Scheduler=Python.
Python=python.exe
; Seven Windows spatial frontends; default remains WindowsSonic.
FrontendFormat=WindowsSonic
; Configure-Scheduler.ps1 fills the initialization module path.
PipelineInitScript=
; Resident survives NSp/FSA exit, stops when preferred multimedia endpoint changes.
PersistEnumerationHook=0
HookHeadphones=0
HookSpeakers=0
; Advanced > NSp Lock captures the live frontend, endpoint and hook requirements.
; LockedFrontend, LockEndpoint, LockFormatGuid and LockHookMask are written by FSA.
NSpLock=0
