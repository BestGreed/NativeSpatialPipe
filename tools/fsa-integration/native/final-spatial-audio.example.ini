; Public defaults: example rule disabled. Copy to final-spatial-audio.ini.
[Manager]
; auto: Chinese Windows UI -> Chinese; otherwise English. zh/en override. Restart to apply.
Language=auto
Fallback=Stereo
DebounceMs=500

[Rule:ExampleGame]
Enabled=0
Exe=YourGame.exe
Scope=Running
Profile=7.1
Priority=300

[NSP]
; Default native orchestration. Empty path resolves beside the integration build.
Scheduler=Zig
ControlExecutable=
; Python is used by telemetry; legacy orchestration requires Scheduler=Python.
Python=python.exe
